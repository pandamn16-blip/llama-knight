name: Terrain development checks
on:
  push:
    branches: [dev/terrain]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/reliability.cjs
      - run: npm run build-nolog
